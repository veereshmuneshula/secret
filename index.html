<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Valentine’s Quiz for C'RI 💖</title>

<style>
    body {
        font-family: 'Segoe UI', sans-serif;
        background: linear-gradient(to bottom, #ffdde1, #ee9ca7);
        margin: 0;
        padding: 20px;
        overflow-x: hidden;
    }

    h1 {
        text-align: center;
        color: #b30059;
    }

    .photo-box {
        text-align: center;
        margin-bottom: 20px;
    }

    .photo-box img {
        width: 180px;
        height: 180px;
        object-fit: cover;
        border-radius: 50%;
        border: 5px solid #ff66a3;
        box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    }

    .photo-box p {
        color: #b30059;
        font-size: 18px;
        margin-top: 10px;
    }

    .quiz {
        max-width: 700px;
        margin: auto;
        background: white;
        padding: 25px;
        border-radius: 15px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }

    .question {
        display: none;
    }

    .question.active {
        display: block;
    }

    .question h3 {
        color: #cc0066;
    }

    .options label {
        display: block;
        padding: 10px;
        margin: 8px 0;
        border-radius: 8px;
        cursor: pointer;
        border: 1px solid #ddd;
        transition: 0.3s;
    }

    .options label:hover {
        background: #ffe6f0;
    }

    input[type="radio"] {
        margin-right: 10px;
    }

    .flower {
        position: fixed;
        top: -50px;
        font-size: 24px;
        animation: fall linear forwards;
        z-index: 9999;
    }

    @keyframes fall {
        to {
            transform: translateY(110vh) rotate(360deg);
            opacity: 0;
        }
    }

    .end {
        text-align: center;
        font-size: 22px;
        color: #b30059;
    }
</style>
</head>

<body>

<h1>💘 Valentine’s Quiz for C'RI 💘</h1>

<div class="photo-box">
    <img src="cri.png" alt="C'RI">
    <p>My Beautiful C'RI ❤️</p>
</div>

<div class="quiz">

    <div class="question active">
        <h3>1. What makes me fall for C'RI every day?</h3>
        <div class="options">
            <label><input type="radio" name="q1" onclick="wrong(this)">Her attitude</label>
            <label><input type="radio" name="q1" onclick="correct(this)">Her smile 💕</label>
            <label><input type="radio" name="q1" onclick="wrong(this)">Her phone</label>
            <label><input type="radio" name="q1" onclick="wrong(this)">Her silence</label>
        </div>
    </div>

    <div class="question">
        <h3>2. What is my favorite moment with C'RI?</h3>
        <div class="options">
            <label><input type="radio" name="q2" onclick="wrong(this)">Watching reels</label>
            <label><input type="radio" name="q2" onclick="wrong(this)">Eating food</label>
            <label><input type="radio" name="q2" onclick="correct(this)">Talking endlessly ❤️</label>
            <label><input type="radio" name="q2" onclick="wrong(this)">Sleeping</label>
        </div>
    </div>

    <div class="question">
        <h3>3. What do I love most about C'RI?</h3>
        <div class="options">
            <label><input type="radio" name="q3" onclick="wrong(this)">Her anger</label>
            <label><input type="radio" name="q3" onclick="correct(this)">Her caring heart 💞</label>
            <label><input type="radio" name="q3" onclick="wrong(this)">Her jokes</label>
            <label><input type="radio" name="q3" onclick="wrong(this)">Her food choices</label>
        </div>
    </div>

    <div class="question">
        <h3>4. What matters most to me?</h3>
        <div class="options">
            <label><input type="radio" name="q4" onclick="wrong(this)">Mobile</label>
            <label><input type="radio" name="q4" onclick="wrong(this)">Career</label>
            <label><input type="radio" name="q4" onclick="correct(this)">C'RI 😘</label>
            <label><input type="radio" name="q4" onclick="wrong(this)">Sleep</label>
        </div>
    </div>

    <div class="question">
        <h3>5. Will C'RI be my Valentine forever?</h3>
        <div class="options">
            <label><input type="radio" name="q5" onclick="correct(this)">Yes, always 💍</label>
            <label><input type="radio" name="q5" onclick="correct(this)">Forever & ever 💖</label>
            <label><input type="radio" name="q5" onclick="correct(this)">No escape 😄</label>
            <label><input type="radio" name="q5" onclick="correct(this)">100% YES 🌹</label>
        </div>
    </div>

    <div class="question end">
        💞 Thank you C'RI 💞 <br>
        You are my forever Valentine ❤️
    </div>

</div>

<script>
function correct(el) {
    disableOptions(el);
    flowers();
    nextQuestion(el);
}

function wrong(el) {
    disableOptions(el);
    nextQuestion(el);
}

function disableOptions(el) {
    el.closest(".options")
      .querySelectorAll("input")
      .forEach(i => i.disabled = true);
}

function nextQuestion(el) {
    const current = el.closest(".question");
    setTimeout(() => {
        current.classList.remove("active");
        current.nextElementSibling?.classList.add("active");
    }, 800);
}

function flowers() {
    for (let i = 0; i < 15; i++) {
        const flower = document.createElement("div");
        flower.className = "flower";
        flower.innerHTML = "🌸";
        flower.style.left = Math.random() * 100 + "vw";
        flower.style.animationDuration = (Math.random() * 2 + 3) + "s";
        document.body.appendChild(flower);
        setTimeout(() => flower.remove(), 5000);
    }
}
</script>

</body>
</html>
